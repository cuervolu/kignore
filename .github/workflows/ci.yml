name: CI

# Only changes that can affect the build or the tests start a run. verify-release.sh uses the same list.
on:
  push:
    branches: [main]
    paths: &build_paths
      - 'kignore/**'
      - 'conformance/fixtures/**'
      - 'conformance/scenarios/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.editorconfig'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *build_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Format and API check
        run: ./gradlew --quiet --console=plain spotlessCheck checkKotlinAbi
      # Chrome is preinstalled on the runner image and runs the browser tests in headless mode.
      - name: Tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew --quiet --console=plain jvmTest linuxX64Test jsTest wasmJsTest compileKotlinMingwX64

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew --quiet --console=plain jvmTest macosArm64Test

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew --quiet --console=plain jvmTest mingwX64Test
